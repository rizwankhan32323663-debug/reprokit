# ReproKit — Cloudflare Pages + Functions configuration.
# IMPORTANT: No secrets live in this file.
# The D1 database_id is created in the dashboard at deploy time;
# see README.md "Production setup" for the exact steps. Do NOT invent IDs.

name = "reprokit"
compatibility_date = "2024-10-01"
# Kept for runtime compatibility (Workers APIs used by storage/crypto helpers).
compatibility_flags = ["nodejs_compat"]

[vars]
# Overridden in production by the dashboard (set to the real site URL).
BETTER_AUTH_URL = "http://localhost:8788"

[[d1_databases]]
binding = "DB"
database_name = "reprokit-db"
migrations_dir = "migrations"
# Real production D1 database ID (Cloudflare dashboard → D1 → reprokit-db).
# This MUST be the real ID: a placeholder here breaks every D1 query at
# runtime (auth, dashboard, reports) with a 500, because the Worker binding
# resolves by this ID. Local dev uses miniflare's local D1 regardless.
database_id = "712a9607-029e-47ff-98f4-83f0f171b9b2"

[[kv_namespaces]]
binding = "EVIDENCE_KV"
# Real production KV namespace id (Workers & Pages -> KV -> reprokit-evidence-kv).
# Wrangler requires the field even for --local; local dev uses miniflare's
# local KV regardless of this value.
id = "f12301ea8b314b8dbb6f41b5e3c7750f"
